name: Deploy Frontend

on:
  push:
    branches:
      - main
      - devserver

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: MentorshipCICD

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

      # ==========================================
      # DEV SERVER
      # ==========================================

      - name: Deploy Dev Server
        if: github.ref == 'refs/heads/devserver'
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github_actions \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" << 'EOF'

          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Go to Git repository root
          cd /home/webprod/apps/mentorship/mentorship

          # Pull latest devserver code
          git fetch origin devserver
          git reset --hard origin/devserver
          git clean -fd

          # Go inside frontend project
          cd mentor

          # ==========================
          # Create .env.local
          # ==========================

          cat > .env.local <<ENV
          NODE_ENV_DEV=${{ secrets.NODE_ENV_DEV }}
          ENV

          # Clean previous Next.js build
          rm -rf .next

          # Install dependencies
          npm install

          # Build Next.js
          npm run build

          # Restart PM2
          pm2 delete mentorship || true
          pm2 restart /home/webprod/apps/mentorship/mentorship/mentor/ecosystem.config.js

          pm2 save

          EOF


      # ==========================================
      # PRODUCTION SERVER
      # ==========================================

      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/github_actions \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" << 'EOF'

          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Go to Git repository root
          cd /home/webprod/apps/mentorship/mentorship

          # Pull latest production code
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # Go inside frontend project
          cd mentor

          # ==========================
          # Create .env.local
          # ==========================

          cat > .env.local <<ENV
          NODE_ENV_PROD=${{ secrets.NODE_ENV_PROD }}
          ENV

          # Clean previous Next.js build
          rm -rf .next

          # Install dependencies
          npm install

          # Build Next.js
          npm run build

          # Restart PM2
          pm2 restart mentorship || pm2 restart ecosystem.config.js --only mentorship

          pm2 save

          EOF